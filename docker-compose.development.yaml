x-default-environment: &default-environment
  NODE_ENV: development
  TZ: "UTC"
  DB_HOST: db
  DB_USER: sa
  DB_NAME: elcc_development
  DB_PASS: &default-db-password DevPwd99!
  DB_PORT: &default-db-port 1433
  DB_TRUST_SERVER_CERTIFICATE: "true"
  DB_HEALTH_CHECK_INTERVAL_SECONDS: 5
  DB_HEALTH_CHECK_TIMEOUT_SECONDS: 10
  DB_HEALTH_CHECK_RETRIES: 3
  DB_HEALTH_CHECK_START_PERIOD_SECONDS: 5
  GATEWAY_HOSTNAME: "${GATEWAY_HOSTNAME:-elcc-data-management.localhost}"
  VUE_APP_FRONTEND_URL: "http://${GATEWAY_HOSTNAME:-elcc-data-management.localhost}"

services:
  api:
    image: "${COMPOSE_PROJECT_NAME:-elcc-data-management}-api"
    pull_policy: never
    build:
      context: ./api
      dockerfile: development.Dockerfile
    env_file:
      - ./api/.env.development
    environment:
      <<: *default-environment
      RELEASE_TAG: ${RELEASE_TAG:-development}
      GIT_COMMIT_HASH: ${GIT_COMMIT_HASH:-not-set}
    tty: true # allows attaching debugger, equivalent of docker exec -t
    init: true
    # stdin_open: true # equivalent of docker exec -i
    user: "${HOST_USER_ID:-0}:${HOST_GROUP_ID:-0}"
    volumes:
      - ./api:/usr/src/api
      - ./.gitignore:/usr/src/.gitignore
      - ./.prettierrc.yaml:/usr/src/.prettierrc.yaml
    depends_on:
      db:
        condition: service_started

  web:
    image: "${COMPOSE_PROJECT_NAME:-elcc-data-management}-web"
    pull_policy: never
    build:
      context: ./web
      dockerfile: development.Dockerfile
    environment:
      <<: *default-environment
      VITE_API_BASE_URL: "http://api.${GATEWAY_HOSTNAME:-elcc-data-management.localhost}"
      OPEN_IN_EDITOR_SESSION_ID:
      OPEN_IN_EDITOR_BRIDGE_PORT: "${OPEN_IN_EDITOR_BRIDGE_PORT:-3333}"
    user: "${HOST_USER_ID:-0}:${HOST_GROUP_ID:-0}"
    volumes:
      - ./web:/usr/src/web
      - ./.gitignore:/usr/src/.gitignore
      - ./.prettierrc.yaml:/usr/src/.prettierrc.yaml
    depends_on:
      api:
        condition: service_started
      api_wait:
        condition: service_completed_successfully

  test_api:
    build:
      context: ./api
      dockerfile: development.Dockerfile
    command: /bin/true
    env_file:
      - ./api/.env.development
    environment:
      <<: *default-environment
      NODE_ENV: test
      DB_NAME: elcc_test
      DEFAULT_LOG_LEVEL: "info"
      DB_HEALTH_CHECK_START_PERIOD_SECONDS: 0
    tty: true
    volumes:
      - ./api:/usr/src/api
      - /usr/src/api/node_modules
    depends_on:
      - db

  test_web:
    build:
      context: ./web
      dockerfile: development.Dockerfile
    command: /bin/true
    environment:
      <<: *default-environment
      NODE_ENV: test
    tty: true
    volumes:
      - ./web:/usr/src/web
      - /usr/src/web/node_modules

  db:
    image: mcr.microsoft.com/mssql/server:2019-CU28-ubuntu-20.04
    user: root
    environment:
      <<: *default-environment
      DB_HOST: "localhost"
      MSSQL_SA_PASSWORD: *default-db-password
      ACCEPT_EULA: "Y"
    volumes:
      - db_data:/var/opt/mssql/data

  # For easily generating large PlantUML diagrams
  # Not relevant to production environment.
  # Accessible at http://localhost:9999
  plantuml:
    image: plantuml/plantuml-server:jetty
    ports:
      - 9999:8080
    environment:
      PLANTUML_LIMIT_SIZE: 8192
    profiles:
      - design

  api_wait:
    image: node:22.20.0-alpine3.22
    depends_on:
      api:
        condition: service_started
    volumes:
      - ./bin/api-wait.mjs:/bin/api-wait.mjs:ro
    entrypoint: ["node", "/bin/api-wait.mjs"]
    restart: "no"

volumes:
  db_data:
